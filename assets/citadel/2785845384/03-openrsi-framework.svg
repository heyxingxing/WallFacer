<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">OpenRSI元进化框架</title><desc id="desc">基础模型经监督冷启动形成改进器。左侧选择父节点、选择进化操作、生成候选并经 Gym 评测。反馈一方面回写搜索树，另一方面形成在线训练轨迹，经强化学习更新改进器参数。</desc><defs>
